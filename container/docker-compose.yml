# 1 サーバ = 1 コンテナ。config は全インスタンスで同一ファイルをマウントし、
# 差分は MQVPN_INSTANCE_IDX のみ (残りはエントリポイントが自動導出:
# tun=mqvpn<idx>, listen=0.0.0.0:(443+idx), control=127.0.0.1:(9090+idx*2),
# exporter=(9091+idx*2), subnet=192.168.<idx>.0/24)。
# network_mode: host のため idx は必須 (コンテナ名から取れない)。
# 増やし方: 下の server ブロックを複写し IDX を変えるだけ
# (prometheus targets は nix ビルド時に自動生成、Grafana は自動追従)。
# 監視: prometheus=127.0.0.1:9000 / grafana=:3000(admin/admin、初回変更)。
# TSDB/grafana.db は named volume 永続化。

x-mqvpn-server: &mqvpn-server
  image: mqvpn-server:latest
  restart: unless-stopped
  network_mode: host
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN
    - NET_BIND_SERVICE
  volumes:
    # 共有 server.conf (hybrid=off) + インスタンスごとに MQVPN_* env で差分
    - ./mqvpn-server-conf:/etc/mqvpn:ro

services:
  mqvpn-server-0:
    <<: *mqvpn-server
    container_name: mqvpn-server-0
    environment:
      # host-net ではコンテナ名が取れないため、インデックスだけ渡す。
      # 残り (tun/listen/control/exporter/subnet) はエントリポイントが自動導出。
      - MQVPN_INSTANCE_IDX=0

  mqvpn-server-1:
    <<: *mqvpn-server
    container_name: mqvpn-server-1
    environment:
      - MQVPN_INSTANCE_IDX=1

  mqvpn-server-2:
    <<: *mqvpn-server
    container_name: mqvpn-server-2
    environment:
      - MQVPN_INSTANCE_IDX=2

  prometheus:
    image: mqvpn-prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: mqvpn-grafana:latest
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      # 初回ログイン時に必ず変更すること。
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning

volumes:
  prometheus-data: {}
  grafana-data: {}
