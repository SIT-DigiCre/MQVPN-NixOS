# 1 サーバ = 1 コンテナ。config は全インスタンスで同一ファイルをマウントする。
# サーバー間の違いはポートフォワード + ENV のみ:
#  - MQVPN_SUBNET: 仮想サブネットの上書き。同一ホストでクライアントインスタンス
#    を複数立ち上げ (ECMP) する運用のみ。subnet の重複はカーネルが許容するため
#    実用上問題ないが、ラボは曖昧さ回避のためサーバーごとに分けて運用。
#    各サーバーが別クライアントを受ける通常運用では設定不要。tun_name は
#    netns 分離により全インスタンス同一でよい
#
# サーバーは `network_mode: host` で動かす。コンテナがホストの netns を共有する
# ため、hybrid=off 時の脱カプセル化トラフィックの次ホップが docker veth/bridge
# (ソフトウェア) ではなく物理 NIC (TSO/GRO/マルチキュー/DMA) になり、OS フォワード
# 経路が回線速度に迫る。hybrid=off は生成される server.conf に設定。
# netns 分離が無くなるため各インスタンスは別の tun_name / listen / control_listen /
# exporter / subnet が必要。これらは MQVPN_INSTANCE_IDX から自動決定される
# (エントリポイントが導出: tun_name=mqvpn<idx>, listen=0.0.0.0:(443+idx),
# control_listen=127.0.0.1:(9090+idx*2), exporter=(9091+idx*2),
# subnet=192.168.<idx>.0/24)。明示的な MQVPN_* env があれば優先。
# 注: network_mode: host ではコンテナのホスト名がホスト(VM)のものになり
# コンテナ名が取れないため、idx は必ず MQVPN_INSTANCE_IDX で渡す (1行のみ)。
#
# 【サーバーの増やし方】mqvpn-server-2 を追加する:
#   - 新サービスの `ports` と MQVPN_SUBNET を変え、`<<: *mqvpn-server` で
#     boilerplate を継承するだけ
#   - prometheus の scrape target は nix ビルド時に compose から自動生成される
#     ため (mqvpn-oci)、compose の編集だけで済む
#   - Grafana は自動対応 (Server 変数が label_values で新インスタンスを拾う)
#
# メトリクス・監視:
#  - 設定は焼き込む(nix 由来)が、書込み先 (prometheus の TSDB / grafana.db) は
#    named volume で永続化する。無名 volume だと --force-recreate や compose down
#    のたびに履歴・設定が消える
#  - grafana は provisioning でデータソースとダッシュボードが自動登録される
#    (http://<host>:3000, admin/…)。ダッシュボード JSON はビルド時に上流から
#    取得・変換されてイメージに焼き込まれるため、手動インポートは不要
#  - Grafana の admin パスワードは平文 "admin" で渡し、初回ログイン時に変更する
#    (ラボ/デモ用途。本番では初回ログインで必ず変更すること)

x-mqvpn-server: &mqvpn-server
  image: mqvpn-server:latest
  restart: unless-stopped
  network_mode: host
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN
    - NET_BIND_SERVICE
  volumes:
    # 共有 server.conf (hybrid=off) + インスタンスごとに MQVPN_* env で差分
    - ./mqvpn-server-conf:/etc/mqvpn:ro

services:
  mqvpn-server-0:
    <<: *mqvpn-server
    container_name: mqvpn-server-0
    environment:
      # host-net ではコンテナ名が取れないため、インデックスだけ渡す。
      # 残り (tun/listen/control/exporter/subnet) はエントリポイントが自動導出。
      - MQVPN_INSTANCE_IDX=0

  mqvpn-server-1:
    <<: *mqvpn-server
    container_name: mqvpn-server-1
    environment:
      - MQVPN_INSTANCE_IDX=1

  prometheus:
    image: mqvpn-prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: mqvpn-grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      # 初回ログイン時に必ず変更すること。
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000/tcp"

volumes:
  prometheus-data: {}
  grafana-data: {}
